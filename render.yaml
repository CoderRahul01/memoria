services:
  - type: web
    name: memoria
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Backboard — Gemma 4 (open weights) + per-person memory for "Ask" ($5 partner credit)
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_LLM_PROVIDER
        value: openrouter
      - key: BACKBOARD_MODEL
        value: google/gemma-4-31b-it
      # ElevenLabs — Scribe transcription, TTS, voice cloning ($100 credit)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EMuO6fFLrXKOryHzij6K
      # Tinker — open-model backup engine; TINKER_MODEL_PATH is a tinker:// checkpoint
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_MODEL_PATH
        sync: false
      - key: TINKER_MODEL
        value: Qwen/Qwen3.6-35B-A3B
      # Neon Postgres — families, stories, analytics events
      - key: DATABASE_URL
        sync: false
      # Dodo Payments — Memoria Lifetime ($19 one-time)
      - key: DODO_PRODUCT_ID
        value: pdt_0NpCLdrsbg89TuTOQ8RfI
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        value: https://memoria-family.vercel.app
