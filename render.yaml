services:
  - type: web
    name: memoria
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # OpenRouter — Gemma 4 (open weights) on the free tier; 26B and Nemotron as fallbacks
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_FAST_MODEL
        value: google/gemma-4-26b-a4b-it:free
      # ElevenLabs — Scribe transcription, TTS, voice cloning ($100 credit)
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EMuO6fFLrXKOryHzij6K
      # Tinker — open-model backup engine; TINKER_MODEL_PATH is a tinker:// checkpoint
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_MODEL_PATH
        sync: false
      - key: TINKER_MODEL
        value: Qwen/Qwen3.6-35B-A3B
      # Neon Postgres — families, stories, analytics events
      - key: DATABASE_URL
        sync: false
      # Dodo Payments — Memoria Lifetime ($19 one-time)
      - key: DODO_PRODUCT_ID
        value: pdt_0NpCLdrsbg89TuTOQ8RfI
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        value: https://memoria-family.vercel.app
      # Credit guard — monthly budgets (10% held back for Lifetime families)
      - key: ELEVENLABS_MONTHLY_CHARS
        value: "100000"
      - key: SCRIBE_MONTHLY_MINUTES
        value: "300"
      - key: ELEVENLABS_VOICE_SLOTS
        value: "25"
      - key: TINKER_MONTHLY_CALLS
        value: "400"
